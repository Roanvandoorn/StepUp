<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef7ff"><title>Shop — StepUp</title><meta name="description" content="Bekijk de volledige StepUp schoenencollectie."><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="assets/style.css"></head>
<body><header id="siteHeader"></header>
<main>
  <section class="page-hero"><div class="wrap"><div class="page-hero-card glass"><span class="kicker">Collectie</span><h1>Vind jouw volgende paar.</h1><p>Filter op stijl, zoek op naam en open ieder model voor maten, pasvorm en productinformatie.</p><div class="detail-badges"><span>Sneakers</span><span>Sport</span><span>Lifestyle</span><span>EU 36–46</span></div></div></div></section>
  <section class="section"><div class="wrap"><div class="shop-shell glass">
    <div class="shop-toolbar-label"><span>StepUp collectie</span><span id="shopResultCount">8 modellen</span></div>
    <div class="category-chips" aria-label="Categorieën">
      <button type="button" class="filter-chip active" data-cat-chip="Alle">Alles</button>
      <button type="button" class="filter-chip" data-cat-chip="Sneakers">Sneakers</button>
      <button type="button" class="filter-chip" data-cat-chip="Sport">Sport</button>
      <button type="button" class="filter-chip" data-cat-chip="Lifestyle">Lifestyle</button>
    </div>
    <div class="shop-tools">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="field" id="search" placeholder="Zoek schoenen..." aria-label="Zoek schoenen"></div>
      <select class="field" id="cat" aria-label="Categorie"><option>Alle</option><option>Sneakers</option><option>Sport</option><option>Lifestyle</option></select>
      <select class="field" id="sort" aria-label="Sorteren"><option value="default">Aanbevolen</option><option value="low">Prijs laag-hoog</option><option value="high">Prijs hoog-laag</option></select>
    </div>
    <div class="products" id="products"></div>
  </div></div></section>
</main>
<footer id="siteFooter"></footer><div id="toast" class="toast"></div><script src="assets/site.js"></script></body></html>
